
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Information</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #f7f7f7, #fffaf0);
            color: #222;
            min-height: 100vh;
            padding: 40px 15px;
        }

        .container {
            max-width: 760px;
            margin: 0 auto;
            background-color: #ffffff;
            border: 2px solid #f0d67a;
            border-radius: 18px;
            padding: 35px 35px 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            animation: fadeUp 0.9s ease;
            position: relative;
            overflow: hidden;
        }

        .container::before {
            content: "";
            position: absolute;
            top: 0;
            left: -120px;
            width: 220px;
            height: 100%;
            background: linear-gradient(
                120deg,
                transparent,
                rgba(255, 215, 0, 0.12),
                transparent
            );
            transform: skewX(-20deg);
            animation: shine 4s ease-in-out infinite;
            pointer-events: none;
        }

        .top-line {
            width: 90px;
            height: 5px;
            background: linear-gradient(to right, #caa437, #f4d35e);
            border-radius: 20px;
            margin: 0 auto 18px;
        }

        h1 {
            margin: 0;
            text-align: center;
            color: #9c7a13;
            font-size: 46px;
            letter-spacing: 1px;
            animation: softPop 0.7s ease;
        }

        .subtitle {
            text-align: center;
            margin-top: 12px;
            color: #666;
            font-size: 16px;
        }

        .subtitle span {
            color: #b68b00;
            font-weight: bold;
        }

        .divider {
            margin: 25px 0 30px;
            border: none;
            height: 1px;
            background: linear-gradient(
                to right,
                transparent,
                #d8b84f,
                transparent
            );
        }

        h3 {
            margin-bottom: 18px;
            color: #9c7a13;
            font-size: 29px;
            position: relative;
            display: inline-block;
        }

        h3::after {
            content: "";
            display: block;
            width: 65%;
            height: 3px;
            background-color: #e4c45a;
            margin-top: 7px;
            border-radius: 10px;
        }

        .info-box {
            background: #fffdf7;
            border: 1px solid #f3e2a2;
            border-radius: 14px;
            padding: 8px 18px;
        }

        .info-item {
            padding: 18px 12px;
            border-bottom: 1px solid #eee3b5;
            font-size: 18px;
            transition: transform 0.25s ease,
                        background-color 0.25s ease;
            animation: slideFade 0.7s ease forwards;
            opacity: 0;
        }

        .info-item:nth-child(1) {
            animation-delay: 0.15s;
        }

        .info-item:nth-child(2) {
            animation-delay: 0.30s;
        }

        .info-item:nth-child(3) {
            animation-delay: 0.45s;
        }

        .info-item:nth-child(4) {
            animation-delay: 0.60s;
        }

        .info-item:nth-child(5) {
            animation-delay: 0.75s;
        }

        .info-item:last-child {
            border-bottom: none;
        }

        .info-item:hover {
            background-color: #fff8df;
            transform: translateX(6px);
        }

        .label {
            font-weight: bold;
            color: #7a5e00;
            margin-right: 6px;
        }

        .footer-note {
            text-align: center;
            margin-top: 25px;
            color: #777;
            font-size: 14px;
        }

        .footer-note span {
            color: #b68b00;
            font-weight: bold;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(35px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideFade {
            from {
                opacity: 0;
                transform: translateY(18px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes softPop {
            from {
                opacity: 0;
                transform: scale(0.96);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes shine {
            from {
                left: -160px;
            }

            to {
                left: 100%;
            }
        }

        @media (max-width: 600px) {
            .container {
                padding: 25px 18px 20px;
            }

            h1 {
                font-size: 34px;
            }

            h3 {
                font-size: 24px;
            }

            .info-item {
                font-size: 16px;
                line-height: 1.8;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .container,
            h1,
            .info-item,
            .container::before {
                animation: none;
            }

            .info-item {
                opacity: 1;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="top-line"></div>

        <h1>Student Information</h1>

        <p class="subtitle">
            Under Supervision of
            <span>Dr. Alaa Al-Hout</span>
        </p>

        <hr class="divider">

        <!-- هان بنحدد مكان محتوى الصفحة -->
        {% block content %}

        {% endblock content %}

    </div>

</body>
</html>
